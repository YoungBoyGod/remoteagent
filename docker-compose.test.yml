version: "3.8"

# RemoteAgent 多设备测试环境
# 启动: docker compose -f docker-compose.test.yml up --build -d
# 停止: docker compose -f docker-compose.test.yml down -v

x-agent-common: &agent-common
  build:
    context: ./agent
    dockerfile: Dockerfile.ubuntu
  restart: unless-stopped
  environment: &agent-env
    AGENT_ENV: dev
    AGENT_SERVER_ADDR: http://server:40001
    AGENT_REGISTER_TOKEN: dev-register-token
    AGENT_LOCAL_ADDR: "0.0.0.0:40002"
    AGENT_DATA_DIR: /app/data
    AGENT_LOG_TO_STDOUT: "true"
    AGENT_METRICS_ENABLED: "true"
  depends_on:
    - server
  networks:
    - ra-net

services:
  postgres:
    image: postgres:17
    container_name: ra-postgres
    restart: unless-stopped
    ports:
      - "25433:5432"
    environment:
      POSTGRES_USER: remotegpu_user
      POSTGRES_PASSWORD: remotegpu_password
      POSTGRES_DB: remotegpu
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./server/docker-compose/postgresql2/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remotegpu_user -d remotegpu"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ra-net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ra-server
    restart: unless-stopped
    ports:
      - "40001:40001"
    environment:
      SERVER_ADDR: ":40001"
      SERVER_REGISTER_TOKEN: dev-register-token
      SERVER_JWT_TTL_SECONDS: "86400"
      SERVER_POLL_TIMEOUT_SECONDS: "30"
      SERVER_DB_HOST: postgres
      SERVER_DB_PORT: "5432"
      SERVER_DB_USER: remotegpu_user
      SERVER_DB_PASSWORD: remotegpu_password
      SERVER_DB_NAME: remotegpu
      SERVER_DB_SSLMODE: disable
      SERVER_DB_CONNECT_TIMEOUT_SECONDS: "10"
      SERVER_LOG_TO_STDOUT: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ra-net

  # ============ Agent 测试实例 (x5) ============
  agent-01:
    <<: *agent-common
    container_name: agent-01
    ports:
      - "40011:40002"
      - "9101:9100"
      - "2201:22"
    environment:
      <<: *agent-env
      AGENT_DEVICE_CODE: device-01
    volumes:
      - agent01_data:/app/data

  agent-02:
    <<: *agent-common
    container_name: agent-02
    ports:
      - "40016:40002"
      - "9102:9100"
      - "2202:22"
    environment:
      <<: *agent-env
      AGENT_DEVICE_CODE: device-02
    volumes:
      - agent02_data:/app/data

  agent-03:
    <<: *agent-common
    container_name: agent-03
    ports:
      - "40013:40002"
      - "9103:9100"
      - "2203:22"
    environment:
      <<: *agent-env
      AGENT_DEVICE_CODE: device-03
    volumes:
      - agent03_data:/app/data

  agent-04:
    <<: *agent-common
    container_name: agent-04
    ports:
      - "40014:40002"
      - "9104:9100"
      - "2204:22"
    environment:
      <<: *agent-env
      AGENT_DEVICE_CODE: device-04
    volumes:
      - agent04_data:/app/data

  agent-05:
    <<: *agent-common
    container_name: agent-05
    ports:
      - "40015:40002"
      - "9105:9100"
      - "2205:22"
    environment:
      <<: *agent-env
      AGENT_DEVICE_CODE: device-05
    volumes:
      - agent05_data:/app/data

  # ============ E2E 测试容器 ============
  e2e-test:
    build:
      context: ./tests
      dockerfile: Dockerfile
    container_name: ra-e2e-test
    environment:
      TEST_SERVER: http://server:40001
      TEST_ADMIN_TOKEN: dev-register-token
      TEST_SSH_USER: root
      TEST_SSH_PASS: "123456"
    depends_on:
      - server
      - agent-01
      - agent-02
      - agent-03
      - agent-04
      - agent-05
    networks:
      - ra-net
    profiles:
      - test

  # ============ 监控栈 ============
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ra-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - agent-01
    networks:
      - ra-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: ra-grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "123456"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - ra-net

networks:
  ra-net:
    driver: bridge

volumes:
  pg_data:
  agent01_data:
  agent02_data:
  agent03_data:
  agent04_data:
  agent05_data:
  prometheus_data:
  grafana_data:
