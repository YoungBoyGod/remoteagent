services:
  # ── 基础设施 ──
  postgres:
    image: postgres:16-alpine
    container_name: ra-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-remotegpu_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-remotegpu_password}
      POSTGRES_DB: ${DB_NAME:-remotegpu}
    ports:
      - "${DB_PORT:-25433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docs/sql/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-remotegpu_user} -d ${DB_NAME:-remotegpu}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ra-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: ra-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # ── 应用服务 ──
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: ${SERVER_IMAGE:-remoteagent-server:latest}
    container_name: ra-server
    environment:
      SERVER_ADDR: ":40001"
      SERVER_REGISTER_TOKEN: "${REGISTER_TOKEN:-dev-register-token}"
      SERVER_JWT_TTL_SECONDS: "86400"
      SERVER_POLL_TIMEOUT_SECONDS: "30"
      SERVER_DB_HOST: "ra-postgres"
      SERVER_DB_PORT: "5432"
      SERVER_DB_USER: "${DB_USER:-remotegpu_user}"
      SERVER_DB_PASSWORD: "${DB_PASSWORD:-remotegpu_password}"
      SERVER_DB_NAME: "${DB_NAME:-remotegpu}"
      SERVER_DB_SSLMODE: "disable"
    ports:
      - "40001:40001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${FRONTEND_IMAGE:-remoteagent-frontend:latest}
    container_name: ra-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - server
    restart: unless-stopped

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    image: ${AGENT_IMAGE:-remoteagent-agent:latest}
    container_name: ra-agent
    environment:
      AGENT_LOCAL_ADDR: "0.0.0.0:40002"
      AGENT_SERVER_ADDR: "http://ra-server:40001"
      AGENT_REGISTER_TOKEN: "${REGISTER_TOKEN:-dev-register-token}"
      AGENT_DEVICE_CODE: "${AGENT_DEVICE_CODE:-agent-001}"
      AGENT_DATA_DIR: "/data"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
