services:
  postgres:
    image: postgres:16-alpine
    container_name: luoyi-postgres
    environment:
      POSTGRES_USER: luoyi
      POSTGRES_PASSWORD: luoyi
      POSTGRES_DB: luoyi
    ports:
      - "25433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docs/sql/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luoyi -d luoyi"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: luoyi-server
    environment:
      SERVER_ADDR: ":40001"
      SERVER_REGISTER_TOKEN: "dev-register-token"
      SERVER_JWT_TTL_SECONDS: "86400"
      SERVER_POLL_TIMEOUT_SECONDS: "30"
      SERVER_DB_HOST: "postgres"
      SERVER_DB_PORT: "5432"
      SERVER_DB_USER: "luoyi"
      SERVER_DB_PASSWORD: "luoyi"
      SERVER_DB_NAME: "luoyi"
      SERVER_DB_SSLMODE: "disable"
    ports:
      - "40001:40001"
    depends_on:
      postgres:
        condition: service_healthy

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: luoyi-agent
    environment:
      AGENT_LOCAL_ADDR: "0.0.0.0:40002"
      AGENT_SERVER_ADDR: "http://server:40001"
      AGENT_REGISTER_TOKEN: "dev-register-token"
      AGENT_DEVICE_CODE: "docker-agent-001"
      AGENT_DATA_DIR: "/data"
    ports:
      - "40002:40002"
    depends_on:
      - server

  mongodb:
    image: mongo:7.0
    container_name: luoyi-graylog-mongodb
    profiles: ["graylog"]
    volumes:
      - graylog_mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"]
      interval: 10s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: luoyi-graylog-opensearch
    profiles: ["graylog"]
    environment:
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      discovery.type: "single-node"
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "Q7r!9mV2#pL4tX8z"
      bootstrap.memory_lock: "true"
      action.auto_create_index: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - graylog_opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  graylog:
    image: graylog/graylog:5.2
    container_name: luoyi-graylog
    profiles: ["graylog"]
    depends_on:
      mongodb:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      GRAYLOG_PASSWORD_SECRET: "luoyi-graylog-password-secret-please-change"
      GRAYLOG_ROOT_PASSWORD_SHA2: "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918"
      GRAYLOG_HTTP_BIND_ADDRESS: "0.0.0.0:9000"
      GRAYLOG_HTTP_EXTERNAL_URI: "http://127.0.0.1:19000/"
      GRAYLOG_MONGODB_URI: "mongodb://mongodb:27017/graylog"
      GRAYLOG_ELASTICSEARCH_HOSTS: "http://opensearch:9200"
      GRAYLOG_SKIP_PREFLIGHT_CHECKS: "true"
    ports:
      - "19000:9000"
      - "12201:12201/udp"
      - "12201:12201/tcp"
    volumes:
      - graylog_journal_data:/usr/share/graylog/data/journal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/api/system/lbstatus -u admin:admin >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  graylog_mongodb_data:
  graylog_opensearch_data:
  graylog_journal_data:
