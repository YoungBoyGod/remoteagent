x-agent-common: &agent-common
  image: alpine:3.20
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./dist/agent:/usr/local/bin/agent:ro
  entrypoint: ["/usr/local/bin/agent"]
  environment: &agent-env
    AGENT_CONFIG_DIR: /tmp/noconfig
    AGENT_SERVER_ADDR: "http://host.docker.internal:40001"
    AGENT_REGISTER_TOKEN: "dev-register-token"
    AGENT_TENANT_ID: "default"
    AGENT_LOG_TO_STDOUT: "true"
    AGENT_DATA_DIR: "/data"
    AGENT_SQLITE_PATH: "agent.db"
  restart: unless-stopped

services:
  agent-1:
    <<: *agent-common
    container_name: ra-agent-1
    environment:
      <<: *agent-env
      AGENT_DEVICE_CODE: "test-agent-001"
      AGENT_LOCAL_ADDR: "0.0.0.0:40002"
    ports:
      - "40011:40002"
    volumes:
      - ./dist/agent:/usr/local/bin/agent:ro
      - agent1-data:/data

  agent-2:
    <<: *agent-common
    container_name: ra-agent-2
    environment:
      <<: *agent-env
      AGENT_DEVICE_CODE: "test-agent-002"
      AGENT_LOCAL_ADDR: "0.0.0.0:40002"
    ports:
      - "40012:40002"
    volumes:
      - ./dist/agent:/usr/local/bin/agent:ro
      - agent2-data:/data

  agent-3:
    <<: *agent-common
    container_name: ra-agent-3
    environment:
      <<: *agent-env
      AGENT_DEVICE_CODE: "test-agent-003"
      AGENT_LOCAL_ADDR: "0.0.0.0:40002"
    ports:
      - "40013:40002"
    volumes:
      - ./dist/agent:/usr/local/bin/agent:ro
      - agent3-data:/data

  agent-4:
    <<: *agent-common
    container_name: ra-agent-4
    environment:
      <<: *agent-env
      AGENT_DEVICE_CODE: "test-agent-004"
      AGENT_LOCAL_ADDR: "0.0.0.0:40002"
    ports:
      - "40014:40002"
    volumes:
      - ./dist/agent:/usr/local/bin/agent:ro
      - agent4-data:/data

  agent-5:
    <<: *agent-common
    container_name: ra-agent-5
    environment:
      <<: *agent-env
      AGENT_DEVICE_CODE: "test-agent-005"
      AGENT_LOCAL_ADDR: "0.0.0.0:40002"
    ports:
      - "40015:40002"
    volumes:
      - ./dist/agent:/usr/local/bin/agent:ro
      - agent5-data:/data

volumes:
  agent1-data:
  agent2-data:
  agent3-data:
  agent4-data:
  agent5-data:
