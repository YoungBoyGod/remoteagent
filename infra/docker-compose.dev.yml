# ============================================================
# RemoteAgent 本地开发一体化环境（Infra + Server + Frontend）
# 用法: docker compose -f infra/docker-compose.dev.yml up -d --build
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: remotegpu_user
      POSTGRES_PASSWORD: remotegpu_password
      POSTGRES_DB: remotegpu
    ports:
      - "25432:5432"
    volumes:
      - dev_pgdata:/var/lib/postgresql/data
      - ../docs/sql/0000_complete_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remotegpu_user -d remotegpu"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "26379:6379"
    volumes:
      - dev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: meili-dev-key
      MEILI_ENV: development
    ports:
      - "27700:7700"
    volumes:
      - dev_meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "29000:9000"
      - "29001:9001"
    volumes:
      - dev_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    environment:
      SERVER_ADDR: ":40001"
      SERVER_REGISTER_TOKEN: dev-register-token
      SERVER_JWT_TTL_SECONDS: "86400"
      SERVER_POLL_TIMEOUT_SECONDS: "30"
      SERVER_DB_HOST: postgres
      SERVER_DB_PORT: "5432"
      SERVER_DB_USER: remotegpu_user
      SERVER_DB_PASSWORD: remotegpu_password
      SERVER_DB_NAME: remotegpu
      SERVER_DB_SSLMODE: disable
      SERVER_DB_CONNECT_TIMEOUT_SECONDS: "10"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: doccenter
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_USE_PATH_STYLE: "true"
      SERVER_LOG_TO_STDOUT: "true"
      SERVER_ENABLE_SWAGGER: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "40001:40001"
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://server:40001
    depends_on:
      server:
        condition: service_started
    ports:
      - "7000:80"
    restart: unless-stopped

volumes:
  dev_pgdata:
  dev_redis_data:
  dev_meili_data:
  dev_minio_data:
