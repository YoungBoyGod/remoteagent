
# ============================================================
# RemoteAgent 本地开发基础设施（仅 Infra，Server/Frontend 本地运行）
# 用法: docker compose -f infra/docker-compose.dev.yml up -d
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-remotegpu_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-remotegpu_password}
      POSTGRES_DB: ${DB_NAME:-remotegpu}
    ports:
      - "${DB_PORT:-25432}:5432"
    volumes:
      - dev_pgdata:/var/lib/postgresql/data
      - ../docs/sql/0000_complete_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-remotegpu_user} -d ${DB_NAME:-remotegpu}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-26379}:6379"
    volumes:
      - dev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-meili-dev-key}
      MEILI_ENV: ${MEILI_ENV:-development}
    ports:
      - "${MEILI_PORT:-27700}:7700"
    volumes:
      - dev_meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfs}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfs}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${RUSTFS_API_PORT:-29000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-29001}:9001"
    volumes:
      - dev_rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  dev_pgdata:
  dev_redis_data:
  dev_meili_data:
  dev_rustfs_data:
