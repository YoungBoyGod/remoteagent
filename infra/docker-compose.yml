# ============================================================
# RemoteAgent 基础设施 (Infra Only)
# 用法: docker compose up -d
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: ra-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-remotegpu_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-remotegpu_password}
      POSTGRES_DB: ${DB_NAME:-remotegpu}
    ports:
      - "${DB_PORT:-25432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../docs/sql/0000_complete_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-remotegpu_user} -d ${DB_NAME:-remotegpu}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ra-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-26379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: ra-meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-meili-dev-key}
      MEILI_ENV: ${MEILI_ENV:-development}
    ports:
      - "${MEILI_PORT:-27700}:7700"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: ra-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-29000}:9000"
      - "${MINIO_CONSOLE_PORT:-29001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ra-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-29090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: ra-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-23000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  redis-data:
  meili-data:
  minio-data:
  prometheus_data:
  grafana_data:
