# ============================================================
# RemoteAgent Docker Agent
# 用法:
#   生产模式（镜像构建）: docker compose --profile prod up -d
#   开发模式（二进制挂载）: docker compose --profile dev up -d
#   扩容: docker compose --profile dev up -d --scale agent-dev=5
# ============================================================

x-agent-common: &agent-env
  AGENT_CONFIG_DIR: /tmp/noconfig
  AGENT_SERVER_ADDR: ${AGENT_SERVER_ADDR:-http://host.docker.internal:40001}
  AGENT_REGISTER_TOKEN: ${AGENT_REGISTER_TOKEN:-dev-register-token}
  AGENT_TENANT_ID: ${AGENT_TENANT_ID:-default}
  AGENT_LOG_TO_STDOUT: "true"
  AGENT_DATA_DIR: /data
  AGENT_SQLITE_PATH: agent.db

services:
  # ── 生产模式: 从 Dockerfile 构建镜像 ──
  agent:
    profiles: ["prod"]
    build:
      context: ../../agent
      dockerfile: Dockerfile
    image: ${AGENT_IMAGE:-remoteagent-agent:latest}
    environment:
      <<: *agent-env
      AGENT_DEVICE_CODE: ${AGENT_DEVICE_CODE:-agent-prod-${HOSTNAME:-unknown}}
      AGENT_LOCAL_ADDR: "0.0.0.0:40002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ── 开发模式: 挂载本地二进制到 alpine ──
  agent-dev:
    profiles: ["dev"]
    image: alpine:3.20
    entrypoint: ["/usr/local/bin/agent"]
    volumes:
      - ../../dist/agent:/usr/local/bin/agent:ro
      - agent-data:/data
    environment:
      <<: *agent-env
      AGENT_DEVICE_CODE: ${AGENT_DEVICE_CODE:-agent-dev-${HOSTNAME:-unknown}}
      AGENT_LOCAL_ADDR: "0.0.0.0:40002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  agent-data:
